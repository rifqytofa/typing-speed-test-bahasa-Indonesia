<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Typing Speed Test — Bahasa Indonesia</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *{box-sizing:border-box}:root{--bg:#0f172a;--card:#172033;--text:#f8fafc;--muted:#94a3b8;--accent:#38bdf8;--good:#4ade80;--bad:#fb7185}body{margin:0;min-height:100vh;font-family:Inter,system-ui,sans-serif;background:radial-gradient(circle at top,#1e3a5f,#0f172a 45%,#080d18);color:var(--text);display:flex;justify-content:center;padding:28px 14px}.wrap{width:min(900px,100%)}header{text-align:center;margin-bottom:22px}h1{margin:0;font-size:clamp(30px,6vw,48px)}header p{color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}.stat{background:#172033;border:1px solid #26344b;border-radius:16px;padding:15px;text-align:center}.stat b{display:block;font-size:25px}.stat span{font-size:12px;color:var(--muted)}.card{background:#172033;border:1px solid #26344b;border-radius:22px;padding:20px;box-shadow:0 18px 50px #0004;margin-bottom:14px}.text-box{background:#0b1220;border:1px solid #2b3a52;border-radius:16px;padding:20px;font-size:20px;line-height:1.8;min-height:160px;margin-bottom:14px;overflow-wrap:anywhere}.char.correct{color:var(--good)}.char.wrong{color:var(--bad);background:#fb71851f}.char.current{border-left:2px solid var(--accent)}textarea{width:100%;height:120px;resize:none;border:1px solid #334155;border-radius:14px;background:#111827;color:white;padding:15px;font:inherit;line-height:1.5;outline:none}textarea:focus{border-color:var(--accent)}.controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}button{border:0;border-radius:12px;padding:12px 17px;font-weight:700;cursor:pointer;background:var(--accent);color:#062033}button.secondary{background:#334155;color:white}button:disabled{opacity:.45}.result{display:none;text-align:center;margin-top:16px;padding:18px;background:#0b1220;border-radius:16px}.result.show{display:block}.big{font-size:40px;font-weight:800}.result p{color:var(--muted)}@media(max-width:600px){.stats{grid-template-columns:repeat(2,1fr)}.text-box{font-size:17px}.card{padding:14px}}
</style></head><body><div class="wrap"><header><h1>⌨️ Typing Speed Test</h1><p>Uji kecepatan dan akurasi mengetik dalam Bahasa Indonesia.</p></header>
<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><div><b id="userStatus">Belum login</b><div id="userSub" style="color:var(--muted);font-size:13px;margin-top:4px">Login untuk menyimpan skor.</div><div id="authError" style="display:none;color:var(--bad);font-size:12px;margin-top:7px"></div></div><div class="controls" style="margin-top:0"><button id="googleBtn">🔵 Login Google</button><button id="anonBtn" class="secondary">👻 Masuk Anonim</button><button id="logoutBtn" class="secondary" style="display:none">Keluar</button></div></div></div>
<div class="stats"><div class="stat"><b id="time">1:00</b><span>WAKTU</span></div><div class="stat"><b id="wpm">0</b><span>WPM</span></div><div class="stat"><b id="accuracy">100%</b><span>AKURASI</span></div><div class="stat"><b id="errors">0</b><span>SALAH</span></div></div>
<div class="card"><div id="textBox" class="text-box"></div><textarea id="input" placeholder="Klik di sini lalu mulai mengetik..." spellcheck="false" autocomplete="off"></textarea><div class="controls"><button id="startBtn">Mulai Tes</button><button id="stopBtn" class="secondary">Stop</button><button id="resetBtn" class="secondary">Ulangi</button></div><div class="controls"><button class="secondary time-btn" data-time="60">1 Menit</button><button class="secondary time-btn" data-time="180">3 Menit</button><button class="secondary time-btn" data-time="0">Tanpa Batas</button></div><div id="result" class="result"><div class="big" id="finalWpm">0 WPM</div><p id="finalInfo"></p></div></div>
<div class="card"><h2 style="margin-top:0">🏆 Papan Peringkat</h2><div id="leaderboard">Memuat...</div></div></div>
<script>
const SUPABASE_URL="https://llydoznicatfslwbsihh.supabase.co", SUPABASE_KEY="sb_publishable_6skvZWBowjJ8a6d5EcXtZg_rO8nwtyF", TABLE="typing_scores", sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const texts=["Indonesia memiliki banyak daerah dengan budaya dan tradisi yang beragam. Setiap daerah mempunyai cerita, bahasa, makanan, kesenian, dan kebiasaan yang membuatnya unik. Keberagaman ini menjadi kekayaan yang perlu dikenal dan dijaga bersama. ","Belajar pemrograman membutuhkan latihan yang konsisten. Kesalahan bukan berarti gagal, melainkan kesempatan untuk memahami cara kerja sebuah program dan menemukan solusi yang lebih baik. Dengan latihan rutin, konsep yang awalnya sulit akan terasa semakin mudah. ","Teknologi berkembang dengan sangat cepat dan memengaruhi banyak kegiatan sehari-hari. Karena itu, kemampuan belajar dan beradaptasi menjadi penting agar teknologi dapat digunakan secara bijak, kreatif, aman, dan bermanfaat. ","Membaca buku dapat menambah wawasan dan memperkaya kosakata. Semakin banyak kata yang kita kenal, semakin mudah kita memahami informasi dan menyampaikan gagasan. Kebiasaan membaca juga membantu kita melihat suatu masalah dari berbagai sudut pandang. ","Pagi yang cerah membuat suasana belajar terasa menyenangkan. Dengan fokus yang baik dan latihan rutin, kemampuan mengetik dapat meningkat sedikit demi sedikit. Yang paling penting adalah menjaga ketelitian sambil membangun kecepatan. "];
const text=[...texts.join("")]; let selectedTime=60,remaining=60,started=false,finished=false,timer=null,startTime=0;
const $=id=>document.getElementById(id), escapeHtml=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function draw(){ $('textBox').innerHTML=text.map((c,i)=>`<span class="char${i===0?' current':''}">${escapeHtml(c)}</span>`).join('') }
function format(s){return s===0?'∞':Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function reset(){clearInterval(timer);started=false;finished=false;remaining=selectedTime;startTime=0;$('time').textContent=format(remaining);$('wpm').textContent=0;$('accuracy').textContent='100%';$('errors').textContent=0;$('input').value='';$('input').disabled=false;$('result').classList.remove('show');$('startBtn').disabled=false;$('startBtn').textContent='Mulai Tes';$('stopBtn').disabled=false;draw()}
function begin(){if(started||finished)return;started=true;startTime=Date.now();if(selectedTime>0)timer=setInterval(()=>{remaining--; $('time').textContent=format(remaining);stats();if(remaining<=0)finish()},1000)}
function stats(){let typed=$('input').value,correct=0,errors=0;document.querySelectorAll('.char').forEach((s,i)=>{s.classList.remove('correct','wrong','current');if(i<typed.length){if(typed[i]===text[i]){s.classList.add('correct');correct++}else{s.classList.add('wrong');errors++}}else if(i===typed.length)s.classList.add('current')});let elapsed=Math.max((Date.now()-startTime)/60000,1/60),wpm=Math.round(correct/5/elapsed),acc=typed.length?Math.round(correct/typed.length*100):100;$('wpm').textContent=wpm;$('accuracy').textContent=acc+'%';$('errors').textContent=errors;return{wpm,accuracy:acc,errors}}
async function finish(){if(finished)return;finished=true;started=false;clearInterval(timer);$('input').disabled=true;let s=stats();$('finalWpm').textContent=s.wpm+' WPM';$('finalInfo').textContent=`Akurasi ${s.accuracy}% • ${s.errors} kesalahan • ${$('input').value.length} karakter`;$('result').classList.add('show');$('startBtn').disabled=false;$('startBtn').textContent='Tes Lagi';$('stopBtn').disabled=true;if(s.wpm>0)await saveScore(s.wpm,s.accuracy)}
async function saveScore(wpm,accuracy){let {data:{user}}=await sb.auth.getUser();if(!user){alert('Login dulu agar skor masuk leaderboard.');return}let name=user.user_metadata?.full_name||user.user_metadata?.name||user.user_metadata?.email?.split('@')[0]||'Anonim';if(user.is_anonymous)name=prompt('Nama leaderboard:','Anonim')||'Anonim';let {error}=await sb.from(TABLE).insert({user_id:user.id,name:String(name).slice(0,30),wpm:Math.round(wpm),accuracy:Math.round(accuracy),duration:selectedTime});if(error){alert('Gagal menyimpan skor: '+error.message);return}loadLeaderboard()}
async function loadLeaderboard(){let el=$('leaderboard');let {data,error}=await sb.from(TABLE).select('name,wpm,accuracy,duration').order('wpm',{ascending:false}).limit(10);if(error){el.innerHTML='<span style="color:var(--bad)">Leaderboard gagal dimuat.</span>';console.error(error);return}el.innerHTML=data.map((s,i)=>`<div style="display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #26344b"><span>#${i+1} ${escapeHtml(s.name)}</span><b>${s.wpm} WPM</b></div>`).join('')||'Belum ada skor.'}
async function authUI(){let {data:{session}}=await sb.auth.getSession();if(session?.user){let u=session.user,name=u.user_metadata?.full_name||u.user_metadata?.email||(u.is_anonymous?'Anonim':'Pengguna');$('userStatus').textContent='👤 '+name;$('userSub').textContent=u.is_anonymous?'Akun anonim aktif.':'Login Google aktif.';$('googleBtn').style.display='none';$('anonBtn').style.display='none';$('logoutBtn').style.display='inline-block'}else{$('userStatus').textContent='Belum login';$('googleBtn').style.display='inline-block';$('anonBtn').style.display='inline-block';$('logoutBtn').style.display='none'}}
$('anonBtn').onclick=async()=>{let {error}=await sb.auth.signInAnonymously();if(error){$('authError').textContent='Login anonim gagal: '+error.message;$('authError').style.display='block'}else authUI()};$('googleBtn').onclick=async()=>{let {error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.href}});if(error)alert(error.message)};$('logoutBtn').onclick=async()=>{await sb.auth.signOut();authUI()};$('input').onfocus=begin;$('input').oninput=()=>{if(!started&&!finished)begin();let s=stats();if($('input').value.length>=text.length)finish()};$('stopBtn').onclick=()=>{if(started)finish()};$('resetBtn').onclick=reset;$('startBtn').onclick=()=>finished?reset():$('input').focus();document.querySelectorAll('.time-btn').forEach(b=>b.onclick=()=>{selectedTime=+b.dataset.time;reset()});draw();reset();authUI();loadLeaderboard();
</script></body></html>
