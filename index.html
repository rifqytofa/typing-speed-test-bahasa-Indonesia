<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Typing Speed Test Bahasa Indonesia</title><meta name="description" content="Uji kecepatan mengetik Bahasa Indonesia secara gratis."><link rel="canonical" href="https://rifqytofa.github.io/typing-speed-test-bahasa-Indonesia/"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,sans-serif;background:#0f172a;color:#f8fafc;padding:24px 14px}.wrap{max-width:900px;margin:auto}header{text-align:center}h1{font-size:clamp(30px,6vw,48px)}.muted{color:#94a3b8}.card{background:#172033;border:1px solid #26344b;border-radius:20px;padding:18px;margin:14px 0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{text-align:center;background:#111827;padding:14px;border-radius:14px}.stat b{display:block;font-size:25px}.text{background:#0b1220;padding:20px;border-radius:15px;font-size:20px;line-height:1.8;min-height:150px}.correct{color:#4ade80}.wrong{color:#fb7185;background:#fb71851f}.current{border-left:2px solid #38bdf8}textarea{width:100%;height:120px;margin-top:14px;border-radius:14px;border:1px solid #334155;background:#111827;color:#fff;padding:15px;font:inherit;resize:none}button{border:0;border-radius:11px;padding:11px 15px;margin:6px 4px 0 0;font-weight:700;cursor:pointer;background:#38bdf8}button.secondary{background:#334155;color:#fff}.result{text-align:center;padding:16px;background:#0b1220;border-radius:14px;margin-top:14px}.big{font-size:40px;font-weight:800}@media(max-width:600px){.stats{grid-template-columns:repeat(2,1fr)}.text{font-size:17px}}</style></head><body><main class="wrap"><header><h1>⌨️ Typing Speed Test</h1><p class="muted">Uji kecepatan dan akurasi mengetik dalam Bahasa Indonesia.</p></header><section class="card"><b id="userStatus">Belum login</b><div id="userSub" class="muted">Login untuk menyimpan skor ke leaderboard.</div><div id="authError" style="color:#fb7185;margin-top:7px"></div><button id="googleBtn">🔵 Login Google</button><button id="anonBtn" class="secondary">👻 Masuk Anonim</button><button id="logoutBtn" class="secondary" hidden>Keluar</button></section><section class="stats"><div class="stat"><b id="time">1:00</b><span class="muted">WAKTU</span></div><div class="stat"><b id="wpm">0</b><span class="muted">WPM</span></div><div class="stat"><b id="accuracy">100%</b><span class="muted">AKURASI</span></div><div class="stat"><b id="errors">0</b><span class="muted">SALAH</span></div></section><section class="card"><div id="textBox" class="text"></div><textarea id="input" placeholder="Klik di sini lalu mulai mengetik..." spellcheck="false"></textarea><div><button id="startBtn">Mulai Tes</button><button id="stopBtn" class="secondary">Stop</button><button id="resetBtn" class="secondary">Ulangi</button></div><div><button class="secondary timeBtn" data-time="60">1 Menit</button><button class="secondary timeBtn" data-time="180">3 Menit</button><button class="secondary timeBtn" data-time="0">Tanpa Batas</button></div><div id="result" class="result" hidden><div id="finalWpm" class="big">0 WPM</div><div id="finalInfo" class="muted"></div></div></section><section class="card"><h2>🏆 Papan Peringkat</h2><div id="leaderboard">Memuat...</div></section></main><script>
const SUPABASE_URL='https://llydoznicatfslwbsihh.supabase.co',SUPABASE_KEY='sb_publishable_6skvZWBowjJ8a6d5EcXtZg_rO8nwtyF',sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY),TABLE='typing_scores';
const texts=['Indonesia memiliki banyak daerah dengan budaya dan tradisi yang beragam. Setiap daerah mempunyai cerita, bahasa, makanan, kesenian, dan kebiasaan yang membuatnya unik. Keberagaman ini menjadi kekayaan yang perlu dikenal dan dijaga bersama. ','Belajar pemrograman membutuhkan latihan yang konsisten. Kesalahan bukan berarti gagal, melainkan kesempatan untuk memahami cara kerja sebuah program dan menemukan solusi yang lebih baik. Dengan latihan rutin, konsep yang awalnya sulit akan terasa semakin mudah. ','Teknologi berkembang dengan sangat cepat dan memengaruhi banyak kegiatan sehari-hari. Karena itu, kemampuan belajar dan beradaptasi menjadi penting agar teknologi dapat digunakan secara bijak, kreatif, aman, dan bermanfaat. '],text=texts.join('');let selectedTime=60,remaining=60,started=false,finished=false,timer=null,startTime=0;const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function draw(){$('textBox').innerHTML=[...text].map((c,i)=>`<span class="char ${i===0?'current':''}">${esc(c)}</span>`).join('')}function fmt(s){return s===0?'∞':Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}function reset(){clearInterval(timer);started=finished=false;remaining=selectedTime;startTime=0;$('time').textContent=fmt(remaining);$('wpm').textContent=0;$('accuracy').textContent='100%';$('errors').textContent=0;$('input').value='';$('input').disabled=false;$('result').hidden=true;$('stopBtn').disabled=false;draw()}function begin(){if(started||finished)return;started=true;startTime=Date.now();if(selectedTime)timer=setInterval(()=>{remaining--;$('time').textContent=fmt(remaining);stats();if(remaining<=0)finish()},1000)}function stats(){let typed=$('input').value,correct=0,errors=0;document.querySelectorAll('.char').forEach((s,i)=>{s.className='char';if(i<typed.length){if(typed[i]===text[i]){s.classList.add('correct');correct++}else{s.classList.add('wrong');errors++}}else if(i===typed.length)s.classList.add('current')});let elapsed=Math.max((Date.now()-startTime)/60000,1/60),wpm=Math.round(correct/5/elapsed),acc=typed.length?Math.round(correct/typed.length*100):100;$('wpm').textContent=wpm;$('accuracy').textContent=acc+'%';$('errors').textContent=errors;return{wpm,accuracy:acc,errors}}async function finish(){if(finished)return;finished=true;started=false;clearInterval(timer);$('input').disabled=true;let s=stats();$('finalWpm').textContent=s.wpm+' WPM';$('finalInfo').textContent=`Akurasi ${s.accuracy}% • ${s.errors} kesalahan • ${$('input').value.length} karakter`;$('result').hidden=false;$('stopBtn').disabled=true;if(s.wpm>0)await saveScore(s.wpm,s.accuracy)}async function saveScore(wpm,accuracy){let {data:{user}}=await sb.auth.getUser();if(!user)return;let name=user.user_metadata?.full_name||user.user_metadata?.name||user.user_metadata?.email?.split('@')[0]||'Anonim';if(user.is_anonymous)name=prompt('Nama leaderboard:','Anonim')||'Anonim';let {error}=await sb.from(TABLE).insert({user_id:user.id,name:String(name).slice(0,30),wpm:Math.round(wpm),accuracy:Math.round(accuracy),duration:selectedTime});if(error)$('authError').textContent='Gagal menyimpan skor: '+error.message;else loadLeaderboard()}async function loadLeaderboard(){let {data,error}=await sb.from(TABLE).select('name,wpm').order('wpm',{ascending:false}).limit(10);if(error){$('leaderboard').textContent='Leaderboard gagal dimuat.';return}$('leaderboard').innerHTML=data?.map((s,i)=>`<div style="display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #26344b"><span>#${i+1} ${esc(s.name)}</span><b>${s.wpm} WPM</b></div>`).join('')||'Belum ada skor.'}
async function authUI(){let {data:{session}}=await sb.auth.getSession();if(session?.user){let u=session.user;$('userStatus').textContent='👤 '+(u.user_metadata?.full_name||u.user_metadata?.email||(u.is_anonymous?'Anonim':'Pengguna'));$('userSub').textContent=u.is_anonymous?'Akun anonim aktif.':'Login Google aktif.';$('googleBtn').hidden=$('anonBtn').hidden=true;$('logoutBtn').hidden=false}else{$('userStatus').textContent='Belum login';$('userSub').textContent='Login untuk menyimpan skor ke leaderboard.';$('googleBtn').hidden=$('anonBtn').hidden=false;$('logoutBtn').hidden=true}}
$('anonBtn').onclick=async()=>{let {error}=await sb.auth.signInAnonymously();if(error)$('authError').textContent='Login anonim gagal: '+error.message;else{ $('authError').textContent='';authUI()}};
$('googleBtn').onclick=async()=>{try{let {data,error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname}});if(error)throw error;if(data?.url)location.assign(data.url)}catch(e){$('authError').textContent='Login Google gagal: '+(e.message||e)}};
$('logoutBtn').onclick=async()=>{await sb.auth.signOut();authUI()};$('input').onfocus=begin;$('input').oninput=()=>{if(!started&&!finished)begin();stats();if($('input').value.length>=text.length)finish()};$('stopBtn').onclick=()=>{if(started)finish()};$('resetBtn').onclick=reset;$('startBtn').onclick=()=>finished?reset():$('input').focus();document.querySelectorAll('.timeBtn').forEach(b=>b.onclick=()=>{selectedTime=+b.dataset.time;reset()});draw();reset();authUI();loadLeaderboard();
</script></body></html>
